<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میهری - پلاتفۆرمی شاهانە</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #070a12; color: #e2e8f0; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .relative-z { position: relative; z-index: 10; }
        .gold-text { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-btn { background: linear-gradient(135deg, #bf953f 0%, #d4af37 50%, #b38728 100%); color: #0b0f17; font-weight: bold; }
        .premium-card { background: rgba(15, 22, 36, 0.8); border: 1px solid rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    
    <div class="relative-z max-w-5xl mx-auto p-6">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-3xl font-black gold-text">میهری</h1>
            <button id="authBtn" onclick="openAuthModal()" class="gold-btn px-6 py-2 rounded-xl">چوونەژوورەوە</button>
        </header>

        <main id="homePage" class="space-y-4">
            <div class="premium-card p-6 rounded-2xl"><h3>دروستکردنی ڕاپۆرت</h3><p>٥,٠٠٠ د.ع</p></div>
            <div class="premium-card p-6 rounded-2xl"><h3>ئامادەکردنی سیمینار</h3><p>٨,٠٠٠ د.ع</p></div>
        </main>

        <div id="dashboardPage" class="hidden premium-card p-6 rounded-2xl">
            <h2 class="text-xl font-bold">بەخێر هاتیت</h2>
            <p>باڵانسی تۆ: <span id="userBalance" class="text-amber-400">0</span> د.ع</p>
        </div>
    </div>

    <div id="authModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm text-white">
            <h3 id="authTitle" class="mb-4 font-bold">چوونەژوورەوە</h3>
            <input type="email" id="emailField" placeholder="ئیمەیڵ" class="w-full p-2 mb-2 rounded text-black">
            <input type="password" id="passwordField" placeholder="پاسۆرد" class="w-full p-2 mb-4 rounded text-black">
            <button onclick="handleAuth()" id="submitAuthBtn" class="gold-btn w-full py-2 rounded-lg">چوونەژوورەوە</button>
            <button onclick="toggleAuthMode()" class="text-xs text-amber-500 mt-4 w-full">گۆڕین بۆ تۆماربوون</button>
        </div>
    </div>

    <script>
        const supabase = Supabase.createClient('https://lydmtihssxpglpfoeyiz.supabase.co', 'sb_p_VWm_EBXynu4Pk1Kx0tjPLw_z7PQoIyy');
        let isSignUpMode = false;

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "تۆماربوون" : "چوونەژوورەوە";
            document.getElementById('submitAuthBtn').innerText = isSignUpMode ? "تۆماربوون" : "چوونەژوورەوە";
        }

        async function handleAuth() {
            const email = document.getElementById('emailField').value;
            const password = document.getElementById('passwordField').value;

            if (isSignUpMode) {
                const { error } = await supabase.from('mihry_users').insert([{ email, password, balance: 0 }]);
                if (error) alert("هەڵە: " + error.message);
                else alert("سەرکەوتوو بوو، ئێستا لۆگین بکە");
            } else {
                const { data, error } = await supabase.from('mihry_users').select('*').eq('email', email).eq('password', password).maybeSingle();
                if (data) {
                    document.getElementById('homePage').classList.add('hidden');
                    document.getElementById('dashboardPage').classList.remove('hidden');
                    document.getElementById('authModal').classList.add('hidden');
                    document.getElementById('userBalance').innerText = data.balance;
                } else {
                    alert("زانیارییەکان هەڵەن");
                }
            }
        }

        // Particle Effect
        const c = document.getElementById('particleCanvas'), x = c.getContext('2d');
        function draw() {
            c.width = window.innerWidth; c.height = window.innerHeight;
            x.fillStyle = "#070a12"; x.fillRect(0,0,c.width, c.height);
            x.fillStyle = "#d4af37";
            for(let i=0; i<40; i++) x.fillRect(Math.random()*c.width, Math.random()*c.height, 2, 2);
            requestAnimationFrame(draw);
        } draw();
    </script>
</body>
</html>
